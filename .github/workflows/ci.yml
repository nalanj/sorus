name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          # Installs everything declared in mise.toml — currently Go only.
          # Cache is enabled by default.

      - run: go version

      - run: go vet ./...

      - run: go build ./...

      # -race: this package fans out across HTTP + concurrent stream events.
      # -count=1: disable Go's test-result cache so a flaky result surfaces.
      - run: go test -race -count=1 ./...
