name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install Go (and any other tools declared in mise.toml).
      - uses: jdx/mise-action@v4

      - run: go version
      - run: go vet ./...
      - run: go build ./...

      # -race: this package fans out across HTTP + concurrent stream events.
      # -count=1: disable Go's test-result cache so a flaky result surfaces.
      - run: go test -race -count=1 ./...
